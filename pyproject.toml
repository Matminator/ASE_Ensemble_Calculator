[build-system]
requires = ["setuptools>=61"]
build-backend = "setuptools.build_meta"

[project]
name = "ase_ensemble_calculator"
version = "1.0.0"
description = "ASE calculator wrapper for ensemble-based uncertainty estimates in atomistic simulation and active-learning workflows"
authors = [
  { name = "Mathias Stokkebye Nissen" },
]
readme = "README.md"
requires-python = ">=3.8"
dynamic = ["dependencies", "optional-dependencies"]
keywords = ["ase", "ensemble", "uncertainty", "active-learning", "atomistic-simulation"]
classifiers = [
  "Intended Audience :: Science/Research",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.8",
  "Programming Language :: Python :: 3.9",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Topic :: Scientific/Engineering",
]

[project.urls]
Repository = "https://github.com/Matminator/ASE_Ensemble_Calculator"
Issues = "https://github.com/Matminator/ASE_Ensemble_Calculator/issues"

[tool.setuptools]
packages = ["ase_ensemble_calculator"]

[tool.setuptools.dynamic]
dependencies = { file = ["requirements.txt"] }

[tool.setuptools.dynamic.optional-dependencies]
dev = { file = ["requirements_dev.txt"] }

[tool.ruff]
line-length = 120

[tool.pytest.ini_options]
testpaths = ["tests"]
